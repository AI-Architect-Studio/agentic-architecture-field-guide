name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docs
        shell: pwsh
        run: ./scripts/validate-docs.ps1

  proof-kit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the local proof kit
        run: node --test scripts/architecture-review.test.mjs scripts/release-evidence.test.mjs
      - name: Generate the illustrative review packet
        run: node scripts/architecture-review.mjs examples/consultant-brief/decision.json

